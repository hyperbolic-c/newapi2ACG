# Optional integration fixture only; no container is started by go test.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: migrator_test
      POSTGRES_PASSWORD: ${MIGRATOR_TEST_PG_PASSWORD:?set a disposable test password}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:${MIGRATOR_TEST_PG_PORT:-55432}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U migrator_test -d postgres"]
      interval: 2s
      timeout: 2s
      retries: 20
